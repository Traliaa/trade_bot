service:
  host: "localhost"
  public_port: 3000
  admin_port: 3001
  workers: 5

telegram:
  token: ""

strategy:
  ltf: "15m"
  htf: "1h"
  donchian_period: 20
  min_channel_pct: 0.0026
  min_body_pct: 0.0015
  breakout_pct: 0.001
  htf_ema_fast: 50
  htf_ema_slow: 200
  min_warmup_ltf: 20
  min_warmup_htf: 200
  expected_symbols: 100
  progress_every: 2m
  watch_top_n: 100
  tune_mode: 2
  min_retest_depth_pct: 0.001
  max_breakout_body_pct: 0.012
  max_breakout_range_pct: 0.018
  min_confirm_body_frac: 0.25
  max_confirm_wick_frac: 0.35
  max_retest_bars: 4
  max_retest_stretch_r: 1.5
  v3:
    min_confirm_score: 5
    retest_tolerance_pct: 0.0015
    impulse_body_min_pct: 0.003
    compression_threshold_pct: 0.012
    strong_close_min: 0.70
    strong_close_max: 0.30
    volume_min_ratio: 0.7
    min_rr: 1.5
    sl_buffer_pct: 0.001
    swing_lookback_bars: 5
    target_lookback_bars: 20
    use_percent_fallback: false
    fallback_stop_pct: 0.01
    atr_period: 14
    atr_stop_mult: 0.8
    use_atr_guard: false

user_defaults:
  default_leverage: 15
  default_max_open_positions: 6
  default_max_long_positions: 3
  default_max_short_positions: 3
  default_position_pct: 1.0
  default_risk_pct: 0.4
  default_stop_pct: 2.0
  default_take_profit_rr: 1.5

default_trailing:
  be_trigger_r: 0.45
  be_offset_r: 0.05
  lock_trigger_r: 0.8
  lock_offset_r: 0.25

  early_time_stop_bars: 3
  early_time_stop_min_mfe_r: 0.15

  time_stop_bars: 8
  time_stop_min_current_r: 0.1

  partial_enabled: true
  partial_trigger_r: 0.7
  partial_close_frac: 0.5

  stale:
    after_bars: 16
    min_mfe_r: 0.35
    exit_profit_r: 0.25
    near_be_r: -0.03
    max_adverse_r: -0.65
    grace_bars: 6
    worse_by_r: 0.30
    tighten_to_be_r: 0.05