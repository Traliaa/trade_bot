service:
  host: "localhost"
  public_port: 3000
  admin_port: 3001
  workers: 5

telegram:
  token: ""

strategy:
  ltf: "15m"
  htf: "1h"
  donchian_period: 20
  min_channel_pct: 0.0026
  min_body_pct: 0.0015
  breakout_pct: 0.001
  htf_ema_fast: 50
  htf_ema_slow: 200
  min_warmup_ltf: 20
  min_warmup_htf: 200
  expected_symbols: 100
  progress_every: 2m
  watch_top_n: 100
  tune_mode: 2
  min_retest_depth_pct: 0.001
  max_breakout_body_pct: 0.012
  max_breakout_range_pct: 0.018
  min_confirm_body_frac: 0.25
  max_confirm_wick_frac: 0.35

user_defaults:
  default_leverage: 15
  default_max_open_positions: 6
  default_position_pct: 1.0
  default_risk_pct: 0.5
  default_stop_pct: 3.0
  default_take_profit_rr: 2.0

default_trailing:
  be_trigger_r: 0.6
  be_offset_r: 0.0
  lock_trigger_r: 0.9
  lock_offset_r: 0.3

  early_time_stop_bars: 4
  early_time_stop_min_mfe_r: 0.15

  time_stop_bars: 12
  time_stop_min_current_r: 0.1

  partial_enabled: true
  partial_trigger_r: 0.9
  partial_close_frac: 0.5